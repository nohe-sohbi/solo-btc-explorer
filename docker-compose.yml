services:
  # Go Backend - Mining Server
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      - POOL_URL=solo.ckpool.org
      - POOL_PORT=3333
    volumes:
      - ./data:/app/data
    networks:
      - soloforge-network
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8080/api/status" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # React Frontend - Dashboard
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - soloforge-network

networks:
  soloforge-network:
    driver: bridge

volumes:
  soloforge-data:
