services:
  # Go Backend - Mining Server
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      - POOL_URL=solo.ckpool.org
      - POOL_PORT=3333
      # Lock CORS + the WebSocket handshake to specific origins in production,
      # e.g. ALLOWED_ORIGINS=https://solo-btc.example.com. Unset = allow all.
      # - ALLOWED_ORIGINS=
    volumes:
      - ./data:/app/data
    networks:
      - soloforge-network
    healthcheck:
      # Liveness probe: /healthz stays 200 even while the pool is reconnecting.
      test: [ "CMD", "wget", "-qO-", "http://localhost:8080/healthz" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # React Frontend - Dashboard
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - soloforge-network

networks:
  soloforge-network:
    driver: bridge

volumes:
  soloforge-data:
